name: Validate billing control boundary

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      operation:
        description: Trusted control operation
        required: true
        type: choice
        options: [collect, recheck]
      candidate_repository:
        description: Must be the approved LawX application repository
        required: true
        type: string
        default: lawxcompany-stack/Plataforma-LawX
      candidate_sha:
        description: Full 40-character candidate commit SHA
        required: true
        type: string
      source_run_id:
        description: Collect workflow run ID; required only for recheck
        required: false
        type: string
        default: ''
      source_run_attempt:
        description: Collect workflow run attempt; required only for recheck
        required: false
        type: string
        default: ''
      runner_label:
        description: Per-attempt billing-validation-<32 lowercase hex> label; collect only
        required: false
        type: string
        default: ''
      supervisor_activation:
        description: Domain-separated SHA-256 workstation activation commitment; collect only
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  policy:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control repository PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npx --yes pnpm@11.5.1 --ignore-workspace install --frozen-lockfile --ignore-scripts
      - name: Run workflow and dispatch policy tests
        run: npx --yes pnpm@11.5.1 --ignore-workspace test
      - name: Lint workflow policy
        run: npx --yes pnpm@11.5.1 --ignore-workspace lint:workflows
      - name: Check secret boundaries
        run: npx --yes pnpm@11.5.1 --ignore-workspace check:secret-boundary

  authorize:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'lawxcompany-stack/billing-validation-control' && github.repository_id == '1384018279' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      operation: ${{ steps.authorize.outputs.operation }}
      candidate_sha: ${{ steps.authorize.outputs.candidate_sha }}
      runner_label: ${{ steps.authorize.outputs.runner_label }}
      activation_commitment: ${{ steps.authorize.outputs.activation_commitment }}
      environments_verified: ${{ steps.environments.outputs.verified }}
    steps:
      - name: Checkout exact triggering workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refuse untrusted dispatches before candidate access
        id: authorize
        env:
          CONTROL_REF: ${{ github.ref }}
          CONTROL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { parseDispatch } from './src/contracts/dispatch.mjs';

          try {
            const identity = parseDispatch(JSON.parse(process.env.DISPATCH_INPUTS), {
              ref: process.env.CONTROL_REF,
              defaultBranch: process.env.CONTROL_DEFAULT_BRANCH,
              repository: process.env.CONTROL_REPOSITORY,
              refProtected: process.env.CONTROL_REF_PROTECTED === 'true',
            });
            appendFileSync(process.env.GITHUB_OUTPUT, [
              `operation=${identity.operation}`,
              `candidate_sha=${identity.candidateSha}`,
              `runner_label=${identity.runnerLabel ?? ''}`,
              `activation_commitment=${identity.activationCommitment ?? ''}`,
              '',
            ].join('\n'));
            console.log(`Authorized ${identity.operation} dispatch for a full candidate SHA.`);
          } catch (error) {
            const code = typeof error?.code === 'string' ? error.code : 'dispatch_refused';
            console.error(`Dispatch refused (${code}).`);
            process.exitCode = 1;
          }
          NODE

      # Configuration proof precedes every Environment job. This does not grant
      # execution approval: each downstream job still waits on its Environment.
      - name: Verify required Environment protection before accessing secrets
        id: environments
        env:
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_REPOSITORY_ID: ${{ github.repository_id }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL_REF_PROTECTED: ${{ github.ref_protected }}
          CONTROL_EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const repository = 'lawxcompany-stack/billing-validation-control';
          const requiredEnvironments = [
            'billing-validation-reader', 'billing-validation-attestation',
            'billing-validation-tests', 'billing-validation-publisher',
          ];
          const baseUrl = `https://api.github.com/repos/${repository}/environments/`;
          const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          const positiveId = value => Number.isSafeInteger(value) && value > 0;
          function requireCondition(condition) { if (!condition) throw new Error('environment_protection_invalid'); }

          async function get(path) {
            const controller = new AbortController();
            const deadline = performance.now() + 10000;
            let timer, response, reader;
            async function read() {
              response = await fetch(baseUrl + path, {
                method: 'GET', redirect: 'error', cache: 'no-store', credentials: 'omit', signal: controller.signal,
                headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.ENVIRONMENT_READ_TOKEN}`,
                  'X-GitHub-Api-Version': '2022-11-28' },
              });
              requireCondition(!controller.signal.aborted && performance.now() < deadline &&
                response?.ok === true && response.status === 200 && !response.redirected);
              requireCondition(response.body && typeof response.body.getReader === 'function');
              reader = response.body.getReader();
              const decoder = new TextDecoder('utf-8', { fatal: true });
              let size = 0, text = '';
              for (;;) {
                const { done, value } = await reader.read();
                requireCondition(!controller.signal.aborted && performance.now() < deadline);
                if (done) break;
                requireCondition(value instanceof Uint8Array);
                size += value.byteLength;
                requireCondition(size <= 65536);
                text += decoder.decode(value, { stream: true });
              }
              return JSON.parse(text + decoder.decode());
            }
            try {
              return await Promise.race([read(), new Promise((resolve, reject) => {
                timer = setTimeout(() => { controller.abort(); reject(new Error('environment_read_timeout')); }, 10000);
              })]);
            } finally {
              clearTimeout(timer);
              controller.abort();
              // Cancellation acknowledgement cannot extend the read deadline.
              try { Promise.resolve(reader ? reader.cancel() : response?.body?.cancel()).catch(() => {}); }
              catch { /* no upstream details */ }
            }
          }

          async function verify(name) {
            const value = await get(name);
            requireCondition(record(value) && positiveId(value.id) && value.name === name && value.url === baseUrl + name);
            requireCondition(Array.isArray(value.protection_rules) && value.protection_rules.length <= 6);
            const rules = value.protection_rules;
            requireCondition(rules.every(rule => record(rule) && positiveId(rule.id) &&
              ['required_reviewers', 'wait_timer', 'branch_policy'].includes(rule.type)));
            requireCondition(new Set(rules.map(rule => rule.type)).size === rules.length);
            const approval = rules.find(rule => rule.type === 'required_reviewers');
            requireCondition(approval?.prevent_self_review === true && Array.isArray(approval.reviewers) &&
              approval.reviewers.length > 0 && approval.reviewers.length <= 6);
            requireCondition(approval.reviewers.every(entry => record(entry) && ['User', 'Team'].includes(entry.type) &&
              record(entry.reviewer) && positiveId(entry.reviewer.id)));
            requireCondition(new Set(approval.reviewers.map(entry => `${entry.type}:${entry.reviewer.id}`)).size === approval.reviewers.length);
            const branch = value.deployment_branch_policy;
            requireCondition(record(branch) && typeof branch.protected_branches === 'boolean' &&
              typeof branch.custom_branch_policies === 'boolean' && branch.protected_branches !== branch.custom_branch_policies);
            requireCondition(rules.some(rule => rule.type === 'branch_policy'));
            if (branch.custom_branch_policies) {
              const policies = await get(`${name}/deployment-branch-policies?per_page=100&page=1`);
              requireCondition(record(policies) && policies.total_count === 1 && Array.isArray(policies.branch_policies) &&
                policies.branch_policies.length === 1 && record(policies.branch_policies[0]) &&
                positiveId(policies.branch_policies[0].id) && policies.branch_policies[0].type === 'branch' &&
                policies.branch_policies[0].name === 'main');
            }
          }

          try {
            requireCondition(process.env.CONTROL_REPOSITORY === repository && process.env.CONTROL_REPOSITORY_ID === '1384018279' &&
              process.env.CONTROL_REF === 'refs/heads/main' && process.env.CONTROL_DEFAULT_BRANCH === 'main' &&
              process.env.CONTROL_REF_PROTECTED === 'true' && process.env.CONTROL_EVENT_NAME === 'workflow_dispatch');
            requireCondition(typeof process.env.ENVIRONMENT_READ_TOKEN === 'string' &&
              /^[\x21-\x7e]+$/u.test(process.env.ENVIRONMENT_READ_TOKEN));
            for (const name of requiredEnvironments) await verify(name);
            appendFileSync(process.env.GITHUB_OUTPUT, 'verified=true\n');
            console.log('Environment protection verified for all required jobs.');
          } catch {
            console.error('Environment protection preflight refused.');
            process.exitCode = 1;
          }
          NODE

  attest-activation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'lawxcompany-stack/billing-validation-control' && github.repository_id == '1384018279' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected && needs.authorize.result == 'success' && needs.authorize.outputs.environments_verified == 'true' && needs.reader.result == 'success' && needs.authorize.outputs.operation == 'collect' }}
    needs: [authorize, reader]
    runs-on: ubuntu-latest
    environment: billing-validation-attestation
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact triggering workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compose canonical activation subject
        env:
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_REPOSITORY_ID: ${{ github.repository_id }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROL_RUN_ID: ${{ github.run_id }}
          CONTROL_RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_WORKFLOW_SHA: ${{ github.sha }}
          CONTROL_EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          RUNNER_LABEL: ${{ needs.authorize.outputs.runner_label }}
          ACTIVATION_COMMITMENT: ${{ needs.authorize.outputs.activation_commitment }}
          ACTIVATION_MANIFEST_PATH: ${{ runner.temp }}/activation-manifest.json
        run: node runner/write-activation-manifest.mjs
      - name: Attest only the canonical activation subject
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # reviewed immutable pin
        with:
          subject-path: ${{ runner.temp }}/activation-manifest.json


  reader:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'lawxcompany-stack/billing-validation-control' && github.repository_id == '1384018279' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected && needs.authorize.result == 'success' && needs.authorize.outputs.environments_verified == 'true' }}
    needs: authorize
    runs-on: ubuntu-latest
    environment: billing-validation-reader
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_tree_sha: ${{ steps.candidate.outputs.candidate_tree_sha }}
      candidate_base_sha: ${{ steps.candidate.outputs.candidate_base_sha }}
      candidate_pull_number: ${{ steps.candidate.outputs.candidate_pull_number }}
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.candidate.outputs.ci_run_attempt }}
    steps:
      - name: Checkout exact triggering workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Create candidate metadata reader token
        id: reader_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BILLING_READER_APP_ID }}
          private-key: ${{ secrets.BILLING_READER_APP_PRIVATE_KEY }}
          owner: lawxcompany-stack
          repositories: Plataforma-LawX
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          skip-token-revoke: false
      - name: Read exact candidate and prerequisite CI jobs
        id: candidate
        env:
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL_REF_PROTECTED: ${{ github.ref_protected }}
          CONTROL_EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          CANDIDATE_READ_TOKEN: ${{ steps.reader_token.outputs.token }}
        run: node scripts/read-candidate.mjs

  test:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'lawxcompany-stack/billing-validation-control' && github.repository_id == '1384018279' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected && needs.authorize.result == 'success' && needs.authorize.outputs.environments_verified == 'true' && needs.reader.result == 'success' && ((needs.authorize.outputs.operation == 'collect' && needs.attest-activation.result == 'success') || (needs.authorize.outputs.operation == 'recheck' && needs.attest-activation.result == 'skipped')) }}
    needs: [authorize, reader, attest-activation]
    runs-on: ${{ needs.authorize.outputs.runner_label != '' && fromJSON(format('["{0}"]', needs.authorize.outputs.runner_label)) || 'ubuntu-latest' }}
    environment: billing-validation-tests
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Verify activation metadata before protected work
        if: ${{ needs.authorize.outputs.operation == 'collect' }}
        env:
          BVC_GITHUB_REPOSITORY: ${{ github.repository }}
          BVC_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BVC_GITHUB_EVENT_NAME: ${{ github.event_name }}
          BVC_GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BVC_GITHUB_REF: ${{ github.ref }}
          BVC_GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          BVC_GITHUB_RUN_ID: ${{ github.run_id }}
          BVC_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BVC_GITHUB_WORKFLOW_SHA: ${{ github.sha }}
          BVC_CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          BVC_ACTIVATION_COMMITMENT: ${{ needs.authorize.outputs.activation_commitment }}
          BVC_RUNNER_LABEL: ${{ needs.authorize.outputs.runner_label }}
        run: |
          node --input-type=module <<'NODE'
          const matches = [
            ['CONTROL_REPOSITORY', 'BVC_GITHUB_REPOSITORY'],
            ['CONTROL_REPOSITORY_ID', 'BVC_GITHUB_REPOSITORY_ID'],
            ['CONTROL_EVENT_NAME', 'BVC_GITHUB_EVENT_NAME'],
            ['CONTROL_DEFAULT_BRANCH', 'BVC_GITHUB_DEFAULT_BRANCH'],
            ['CONTROL_REF', 'BVC_GITHUB_REF'],
            ['CONTROL_WORKFLOW_REF', 'BVC_GITHUB_WORKFLOW_REF'],
            ['CONTROL_RUN_ID', 'BVC_GITHUB_RUN_ID'],
            ['CONTROL_RUN_ATTEMPT', 'BVC_GITHUB_RUN_ATTEMPT'],
            ['CONTROL_WORKFLOW_SHA', 'BVC_GITHUB_WORKFLOW_SHA'],
            ['CONTROL_CANDIDATE_SHA', 'BVC_CANDIDATE_SHA'],
            ['CONTROL_ACTIVATION_COMMITMENT', 'BVC_ACTIVATION_COMMITMENT'],
            ['CONTROL_RUNNER_LABEL', 'BVC_RUNNER_LABEL'],
          ].every(([actual, expected]) => typeof process.env[actual] === 'string' &&
            process.env[actual] === process.env[expected]);
          if (!matches) {
            console.error('Activation metadata does not match this GitHub job.');
            process.exitCode = 1;
          }
          NODE
      - name: Fail closed until the isolated collector is implemented
        run: |
          echo 'Billing and browser execution is not enabled by Task 1.' >&2
          exit 1

  publisher:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'lawxcompany-stack/billing-validation-control' && github.repository_id == '1384018279' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected && needs.authorize.result == 'success' && needs.authorize.outputs.environments_verified == 'true' && needs.reader.result == 'success' && needs.test.result == 'success' && ((needs.authorize.outputs.operation == 'collect' && needs.attest-activation.result == 'success') || (needs.authorize.outputs.operation == 'recheck' && needs.attest-activation.result == 'skipped')) }}
    needs: [authorize, reader, attest-activation, test]
    runs-on: ubuntu-latest
    environment: billing-validation-publisher
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fail closed until canonical check publication is implemented
        run: |
          echo 'Readiness check publication is not enabled by Task 1.' >&2
          exit 1
